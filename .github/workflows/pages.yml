name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        shell: bash
        run: |
          cp CNAME HTML/CNAME
          cp googleedc821fe5316c616.html HTML/googleedc821fe5316c616.html

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: HTML

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
